var ORDER=['chair','balloon','cyber','dog','cat','audio','animal','food','color','weather','city','flower'];
var ST={},stage=document.getElementById('stage');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function refBox(d){return d.ref?'<div class="refbox">'+d.ref.map(function(r){return '<div><b>'+esc(r[0])+'</b> · '+esc(r[1])+'</div>';}).join('')+'</div>':'';}
function head(d){return '<div class="qhead"><div class="badge">'+esc(d.t)+'</div><h2>'+esc(d.name)+'</h2></div><p class="qnote">'+esc(d.note)+'</p>'+refBox(d);}

/* 图片 / 色块 选择 */
function renderGrid(id){
  var d=DATA[id],isSw=(d.kind==='swatch');
  stage.innerHTML=head(d)+'<p class="hint">点一个你直觉想选的（没有对错，别想太久）。</p>'+
   '<div class="'+(isSw?'sgrid':'egrid')+'">'+d.items.map(function(it){
     return isSw
      ? '<button class="sitem" data-k="'+it[2]+'" style="background:'+it[0]+'"><span class="nm">'+esc(it[1])+'</span></button>'
      : '<button class="eitem" data-k="'+it[2]+'"><img src="img/'+it[0]+'.jpg" alt="'+esc(it[1])+'"><span class="nm">'+esc(it[1])+'</span></button>';
   }).join('')+'</div>';
  [].forEach.call(stage.querySelectorAll('[data-k]'),function(b){
    b.onclick=function(){b.classList.add('sel');
      var img=(d.kind==='swatch')?'':'img/'+d.items.filter(function(x){return x[2]===b.dataset.k;})[0][0]+'.jpg';
      setTimeout(function(){showResult(id,b.dataset.k,img,'');},220);};
  });
}

/* MBTI 答题 */
function renderMbti(id){
  var d=DATA[id];ST[id]={qi:0,sc:{E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}};
  stage.innerHTML=head(d)+'<div id="mq"></div>';
  mQ(id);
}
function mQ(id){
  var d=DATA[id],s=ST[id],q=d.qs[s.qi];
  document.getElementById('mq').innerHTML='<div class="prog">第 '+(s.qi+1)+' / '+d.qs.length+' 题</div>'+
   '<div class="qtext">'+esc(q[0][0])+'</div><div class="opts">'+
   q.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o[0])+'</button>';}).join('')+'</div>';
  [].forEach.call(document.querySelectorAll('#mq .opt'),function(b){
    b.onclick=function(){var o=d.qs[s.qi][+b.dataset.i];s.sc[o[1]]++;s.qi++;
      (s.qi<d.qs.length)?mQ(id):mDone(id);};
  });
}
function mDone(id){
  var s=ST[id].sc;
  var k=(s.E>=s.I?'E':'I')+(s.S>=s.N?'S':'N')+(s.T>=s.F?'T':'F')+(s.J>=s.P?'J':'P');
  showResult(id,k,'img/'+DATA[id].results[k][0]+'.jpg','MBTI 类型：<b>'+k+'</b>');
}

function drawChair(c){
  var id=c.id,cx=c.cx,cy=c.cy,dir=c.dir,back='';
  if(dir==='L')back='<rect class="cv-back" x="'+(cx-35)+'" y="'+(cy-20)+'" width="13" height="40" rx="5"/>';
  else if(dir==='R')back='<rect class="cv-back" x="'+(cx+22)+'" y="'+(cy-20)+'" width="13" height="40" rx="5"/>';
  else if(dir==='B')back='<rect class="cv-back" x="'+(cx-20)+'" y="'+(cy+22)+'" width="40" height="13" rx="5"/>';
  else if(dir==='T')back='<rect class="cv-back" x="'+(cx-20)+'" y="'+(cy-35)+'" width="40" height="13" rx="5"/>';
  return '<g class="cv" data-id="'+id+'">'+back+'<rect class="cvseat" x="'+(cx-22)+'" y="'+(cy-22)+'" width="44" height="44" rx="10"/><circle class="cvring" cx="'+cx+'" cy="'+cy+'" r="30"/><circle class="cvbadge" cx="'+cx+'" cy="'+cy+'" r="15"/><text class="cvnum" x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle">'+id+'</text><rect class="cvhit" x="'+(cx-30)+'" y="'+(cy-30)+'" width="60" height="60"/></g>';
}
function renderChair(id){
  var d=DATA[id];
  if(!d.scenes[cvScene])cvScene='long';
  stage.innerHTML=head(d)+
    '<div class="ctabs">'+Object.keys(d.scenes).map(function(k){return '<button class="ctab'+(k===cvScene?' active':'')+'" data-s="'+k+'">'+esc(d.scenes[k].name)+'</button>';}).join('')+'</div>'+
    '<svg class="cvroom" viewBox="0 0 680 520" role="img" aria-label="会议室俯视图"><g id="cvstatic"></g><g id="cvchairs"></g></svg>'+
    '<p class="hint">点一把椅子坐下（① 最靠近主持位，⑦ 正对老板，⑧ 靠窗，⑨ 靠门）。</p>';
  paintChairRoom(id);
  [].forEach.call(stage.querySelectorAll('.ctab'),function(b){b.onclick=function(){cvScene=b.dataset.s;renderChair(id);};});
  [].forEach.call(stage.querySelectorAll('.cv'),function(g){g.onclick=function(){cvPick(id,g);};});
}
function paintChairRoom(id){
  var L=DATA[id].scenes[cvScene];
  document.getElementById('cvstatic').innerHTML=CHAIR_ROOM+L.table;
  document.getElementById('cvchairs').innerHTML=L.chairs.map(drawChair).join('');
}
function cvPick(id,g){
  var cid=g.dataset.id;
  stage.querySelectorAll('.cv').forEach(function(x){x.classList.toggle('selected',x===g);x.classList.toggle('dim',x!==g);});
  showChairResult(id,cid);
}
function showChairResult(id,cid){
  var d=DATA[id],c=d.chairs[cid];
  if(!c)return;
  var DIM=[['act','主动进取','#ef6c4d'],['ind','独立思考','#4d8def'],['soc','社交亲和','#46c08a'],['risk','风险偏好','#f0b429'],['auth','权威亲近','#9b6ef0']];
  var bars=DIM.map(function(x){var v=c.dim[x[0]];return '<div class="cbar-row"><span class="cbar-label">'+x[1]+'</span><span class="cbar-track"><span class="cbar-fill" style="background:'+x[2]+'" data-v="'+v+'"></span></span><span class="cbar-val" style="color:'+x[2]+'">'+v+'</span></div>';}).join('');
  stage.innerHTML='<div class="result">'+
    '<div class="rtype">你的落座人格 · 椅子 '+cid+' · '+esc(d.scenes[cvScene].name)+'</div>'+
    '<div class="crpick">'+c.icon+'</div>'+
    '<div class="rname">'+esc(c.name)+'</div>'+
    '<div class="cren">'+esc(c.en)+'</div>'+
    '<div class="rline">「'+esc(c.quote)+'」</div>'+
    '<div class="tags">'+c.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+'</div>'+
    '<div class="csec">你的特点</div>'+
    '<ul class="cfeat">'+c.feat.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul>'+
    '<div class="csec">五维人格画像</div>'+
    '<div class="cbars">'+bars+'</div>'+
    '<div class="blind">盲区：'+esc(c.blind)+'</div>'+
    '<div class="copy"><b>可晒文案</b>'+esc(c.copy)+'</div>'+
    '<div class="btnrow"><button class="btn" id="again">再选一次</button><button class="btn ghost" id="back">换一个测验</button></div></div>';
  requestAnimationFrame(function(){stage.querySelectorAll('.cbar-fill').forEach(function(el){el.style.width=el.dataset.v+'%';});});
  document.getElementById('again').onclick=function(){renderChair(id);};
  document.getElementById('back').onclick=function(){go(ORDER[(ORDER.indexOf(id)+1)%ORDER.length]);};
}

/* 气球 */
var BL=null;
function roll(){return 4+Math.floor(Math.random()*17);}
function renderBalloon(id){
  var d=DATA[id];
  BL={id:id,i:0,pumps:0,temp:0,total:0,pops:0,sumPumps:0,popAt:roll(),trials:5};
  stage.innerHTML=head(d)+'<div class="bl"><div class="blslot"><div class="balloon" id="bl"></div></div>'+
   '<div class="pumps" id="blp"></div><div class="blrow"><button class="btn ghost" id="bank">收下得分</button></div>'+
   '<div class="hint">按 <b>空格键</b> 给气球打气</div><div class="bstat" id="bls"></div></div>';
  blPaint();
  document.getElementById('bank').onclick=blBank;
}
function blLock(v){document.getElementById('bank').disabled=v;}
function blPaint(){
  var sc=Math.min(1.22,1+BL.pumps*0.016);
  document.getElementById('bl').style.transform='scale('+sc+')';
  document.getElementById('blp').textContent='本轮已打气 '+BL.pumps+' 次 · 当前可收 '+BL.temp+' 分';
  document.getElementById('bls').innerHTML='第 '+(BL.i+1)+'/'+BL.trials+' 个气球 · 总分 <b>'+BL.total+'</b> · 已爆 <b>'+BL.pops+'</b>';
}
function blPump(){
  BL.pumps++;BL.sumPumps++;BL.temp+=2;
  if(BL.pumps>=BL.popAt){
    BL.pops++;document.getElementById('bl').classList.add('pop');
    document.getElementById('blp').textContent='爆了！这轮 '+BL.temp+' 分没了';
    document.getElementById('bls').innerHTML='第 '+(BL.i+1)+'/'+BL.trials+' 个气球 · 总分 <b>'+BL.total+'</b> · 已爆 <b>'+BL.pops+'</b>';
    blLock(true);setTimeout(blNext,1100);return;
  }
  blPaint();
}
function blBank(){BL.total+=BL.temp;document.getElementById('blp').textContent='收下 '+BL.temp+' 分';document.getElementById('bank').blur();blLock(true);setTimeout(blNext,700);}
function blNext(){
  BL.i++;BL.temp=0;BL.pumps=0;BL.popAt=roll();
  if(BL.i>=BL.trials){blFinish();return;}
  document.getElementById('bl').classList.remove('pop');blLock(false);blPaint();
}
function blFinish(){
  var avg=BL.sumPumps/BL.trials;
  var key=avg<=3?'safe':avg<=6?'steady':avg<=10?'balance':avg<=14?'risk':'wild';
  if(BL.pops>=3&&(key==='balance'||key==='risk'))key=(key==='balance')?'risk':'wild';
  showResult(BL.id,key,'','总分 <b>'+BL.total+'</b> 分 · 爆掉 <b>'+BL.pops+'/'+BL.trials+'</b> · 平均打气 <b>'+avg.toFixed(1)+'</b> 次');
}

/* 抛球 */
var CB=null;
function cbPos(id){
  if(!CB.hasC)return {A:[22,14],B:[78,14],me:[50,80]}[id];
  return {A:[18,16],B:[82,16],C:[18,82],me:[82,82]}[id];
}
function cbPlayers(){
  var p=[{id:'me',em:'🙋',nm:'你'},{id:'A',em:'🐨',nm:'小A'},{id:'B',em:'🐰',nm:'小B'}];
  if(CB.hasC)p.push({id:'C',em:'🐣',nm:'小C'});
  return p;
}
function cbPaint(){
  document.getElementById('cb').innerHTML=cbPlayers().map(function(p){
    var q=cbPos(p.id);
    var pick=CB.choice&&CB.choice.ids.indexOf(p.id)>=0;
    return '<div class="pl'+(p.id==='me'?' me':'')+(CB.holder===p.id?' has':'')+(pick?' pick':'')+'" '+
      'style="left:'+q[0]+'%;top:'+q[1]+'%"'+(pick?' data-pick="'+p.id+'"':'')+'>'+
      '<div class="av">'+p.em+'</div><div class="nm2">'+esc(p.nm)+'</div>'+
      '<div class="ball">'+(CB.holder===p.id?'⚽':'')+'</div><div class="think">'+(CB.think===p.id?'···':'')+'</div></div>';
  }).join('');
  if(CB.choice){
    [].forEach.call(document.querySelectorAll('#cb .pl.pick'),function(el){
      el.onclick=function(){
        var t=el.dataset.pick, f=CB.choice.fn;
        CB.choice=null; cbAct(''); cbPaint();
        f(t);
      };
    });
  }
}
function cbStat(t){document.getElementById('cbstat').innerHTML=t;}
function cbAct(h){document.getElementById('cbact').innerHTML=h;}
function cbAsk(ids,fn){
  CB.choice={ids:ids,fn:fn};
  cbAct('<div class="hint">点击你想传球的头像</div>');
  cbPaint();
}
function aiThrow(to,fn){
  CB.think=CB.holder;cbPaint();
  setTimeout(function(){CB.think=null;CB.holder=to;cbPaint();setTimeout(fn,300+Math.random()*220);},500);
}
function renderCyber(id){
  var d=DATA[id];
  CB={id:id,phase:1,holder:'A',think:null,p3:{A:0,B:0,C:0},mirror:0,hasC:false};
  stage.innerHTML=head(d)+'<div class="cbstat" id="cbstat"></div><div class="cb" id="cb"></div><div class="choices" id="cbact"></div>';
  cbPaint();runP1(0);
}
var P1=['me','B','me','A','me','B'];
function runP1(i){
  if(i>=P1.length){CB.phase=2;cbStat('第一轮结束——你拿到球 3 次。第二轮开始。');setTimeout(function(){runP2(0);},1100);return;}
  var to=P1[i];
  cbStat('第一轮 · 热身（第 '+(i+1)+'/'+P1.length+' 次传递）');
  if(to==='me')aiThrow('me',function(){cbAsk(['A','B'],function(t){CB.holder=t;cbPaint();setTimeout(function(){runP1(i+1);},380);});});
  else aiThrow(to,function(){runP1(i+1);});
}
function runP2(i){
  if(i>=4){CB.phase=3;CB.hasC=true;cbPaint();
    cbStat('小C 加入了。球回到你手上——接下来 6 次都由你决定传给谁。');
    setTimeout(function(){runP3(0);},1400);return;}
  cbStat('第二轮 · 你已经 <b>'+i+'</b> 次没拿到球了');
  aiThrow(Math.random()<0.5?'A':'B',function(){runP2(i+1);});
}
var IN3=['A','B','C','A','B','C'];
function runP3(i){
  if(i>=IN3.length){cbFin();return;}
  var from=IN3[i];CB.holder=from;cbPaint();
  cbStat('第三轮 · 第 '+(i+1)+'/'+IN3.length+' 次 · 把球传给谁？');
  setTimeout(function(){
    aiThrow('me',function(){
      cbAsk(['A','B','C'],function(t){
        CB.p3[t]++;if(t===from)CB.mirror++;
        if(t==='C'){
          cbStat('小C 接到球——它要抛给谁？');
          setTimeout(function(){
            var recips=['A','B','me'];
            var to=recips[Math.floor(Math.random()*recips.length)];
            aiThrow(to,function(){ setTimeout(function(){runP3(i+1);},420); });
          },800);
        }else{
          CB.holder=t;cbPaint();
          setTimeout(function(){runP3(i+1);},420);
        }
      });
    });
  },520);
}
function cbFin(){
  var p=CB.p3, key;
  var spread=Math.max(p.A,p.B,p.C)-Math.min(p.A,p.B,p.C);
  var allThree=p.A>=1&&p.B>=1&&p.C>=1;
  if(p.C>=3)key='care';
  else if(CB.mirror>=4)key='ledger';
  else if((p.A+p.B)>=4)key='forgive';
  else if(allThree&&spread<=1)key='turn';
  else key='careless';
  var stats='传给小C <b>'+p.C+'</b> 次 · 传给小A/小B <b>'+(p.A+p.B)+'</b> 次 · 回传给刚传给你的人 <b>'+CB.mirror+'</b> 次';
  showResult(CB.id,key,'',stats);
}

/* 结果 */
function showResult(id,k,img,stats){
  var d=DATA[id],r=d.results[k];if(!r)return;
  var hasImg=r.length>=6;
  var src=(img||(hasImg?'img/'+r[0]+'.jpg':''));
  var n=hasImg?1:0;
  stage.innerHTML='<div class="result">'+
    '<div class="rtype">你的结果 · '+esc(d.name)+'</div>'+
    (src?'<img class="rimg" src="'+src+'" alt="">':'')+
    '<div class="rname">'+esc(r[n])+'</div>'+
    '<div class="rline">「'+esc(r[n+1])+'」</div>'+
    '<div class="tags">'+r[n+2].split('|').map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+'</div>'+
    '<div class="blind">盲区：'+esc(r[n+3])+'</div>'+
    (stats?'<div class="rstats">'+stats+'</div>':'')+
    '<div class="copy"><b>可晒文案</b>'+esc(r[n+4])+'</div>'+
    '<div class="btnrow"><button class="btn" id="again">再玩一次</button><button class="btn ghost" id="back">换一个测验</button></div></div>';
  document.getElementById('again').onclick=function(){go(id);};
  document.getElementById('back').onclick=function(){go(ORDER[(ORDER.indexOf(id)+1)%ORDER.length]);};
}

/* 调度 */
function go(id){
  BL=null;CB=null;
  ST[id]={};
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.q===id);});
  var k=DATA[id].kind;
  if(k==='grid'||k==='swatch')renderGrid(id);
  else if(k==='chair')renderChair(id);
  else if(k==='mbti')renderMbti(id);
  else if(k==='balloon')renderBalloon(id);
  else renderCyber(id);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('tabs').innerHTML=ORDER.map(function(id){
  return '<button data-q="'+id+'">'+esc(DATA[id].t)+'</button>';
}).join('');
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(b&&b.dataset.q)go(b.dataset.q);
});
go('chair');

document.addEventListener('keydown', function(e){
  if(e.code==='Space' || e.key===' ' || e.key==='Spacebar'){
    if(e.repeat) return;
    var bank=document.getElementById('bank');
    if(BL && document.getElementById('bl') && bank && !bank.disabled){
      e.preventDefault();
      blPump();
    }
  }
});
</script>
</body>
</html>
