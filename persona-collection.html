<html lang="zh-CN" data-page-node-id="fO4KGYA7xUbTwpU0IXGqcn">
<head data-page-node-id="WizsoK1QJdVP5OhRwhDDO2">
<meta charset="UTF-8" data-page-node-id="IQxEsEGiwBzbuC1IBfquRB">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="cEQklMC9YRpJwba0RBP7wy">
<title>人格营销测验 · 合集版</title>
<style>
  :root{
    --navy:#142A40; --teal:#24A69E; --orange:#F29A49;
    --grey:#738796; --line:#DCE8E8; --panel:#EAF7F4; --ink:#1F2D3A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","微软雅黑","Segoe UI Emoji","Apple Color Emoji",-apple-system,sans-serif;
    background:#fff;color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 28px}

  .hero{padding:56px 0 30px;border-bottom:1px solid var(--line)}
  .kicker{font-size:12px;letter-spacing:.16em;color:var(--teal);font-weight:700;margin-bottom:12px}
  h1{font-size:30px;line-height:1.3;color:var(--navy);font-weight:700;margin-bottom:12px}
  .sub{font-size:14px;color:var(--grey);max-width:640px}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--line)}
  .tabs button{font-family:inherit;font-size:13px;cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--grey);padding:8px 16px;border-radius:2px;transition:.15s}
  .tabs button:hover{border-color:var(--teal);color:var(--teal)}
  .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}

  .stage{padding:34px 0 60px;min-height:420px}

  .qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .badge{flex:none;width:30px;height:30px;border-radius:2px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .qhead h2{font-size:20px;color:var(--navy);font-weight:700}
  .qnote{font-size:13px;color:var(--grey);margin:0 0 20px 42px}

  .refbox{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin:0 0 20px 42px;font-size:12.5px;color:var(--grey)}
  .refbox div + div{margin-top:4px}
  .refbox b{color:var(--teal);font-weight:700}

  .btn{font-family:inherit;font-size:14px;cursor:pointer;background:var(--navy);color:#fff;border:none;padding:11px 26px;border-radius:2px;transition:.15s}
  .btn:hover{background:var(--teal)}
  .btn.ghost{background:#fff;color:var(--grey);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--teal);color:var(--teal);background:#fff}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

  .hint{font-size:12.5px;color:var(--grey);margin-bottom:16px}

  /* emoji 选择器 */
  .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
  .eitem{
    font-family:inherit;text-align:center;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:3px;
    padding:16px 8px 12px;transition:.15s;
  }
  .eitem:hover{border-color:var(--teal);background:var(--panel)}
  .eitem.sel{background:var(--teal);border-color:var(--teal)}
  .eitem .em{display:block;font-size:38px;line-height:1.25}
  .eitem .nm{display:block;font-size:12px;color:var(--grey);margin-top:6px}
  .eitem.sel .nm{color:#fff}

  /* 会议室 */
  .room{position:relative;height:360px;border:1px solid var(--line);border-radius:3px;background:#fff;margin-bottom:8px}
  .table{position:absolute;left:50%;top:100px;width:56%;height:150px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--grey);letter-spacing:.1em}
  .seat{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--grey);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .seat:hover{border-color:var(--teal);color:var(--teal);background:var(--panel)}
  .seat.boss{background:var(--navy);border-color:var(--navy);color:#fff;cursor:default}
  .seat.boss:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .seat.sel{background:var(--teal);border-color:var(--teal);color:#fff}

  /* 结果卡 */
  .result{border:1px solid var(--line);border-radius:3px;padding:26px 26px 22px;background:#fff}
  .rtype{font-size:12px;color:var(--teal);font-weight:700;letter-spacing:.1em;margin-bottom:8px}
  .rname{font-size:26px;color:var(--navy);font-weight:700;margin-bottom:6px;line-height:1.3}
  .rpick{font-size:34px;margin-bottom:10px;line-height:1.2}
  .rline{font-size:15px;color:var(--grey);font-style:italic;margin-bottom:16px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{font-size:12px;color:var(--teal);border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:2px}
  .blind{font-size:13px;color:var(--grey);margin-bottom:16px}
  .copy{background:var(--panel);border-left:2px solid var(--orange);padding:12px 14px;font-size:13.5px;color:var(--ink);margin-bottom:20px}
  .copy b{display:block;color:var(--orange);font-size:11px;letter-spacing:.06em;margin-bottom:4px}

  .band{background:var(--navy);color:#fff;padding:24px 0}
  .band p{font-size:12.5px;color:#C8D6DF;max-width:780px}
  .band p + p{margin-top:7px}

  @media (max-width:720px){
    .wrap{padding:0 18px}
    h1{font-size:24px}
    .refbox,.qnote{margin-left:0}
    .room{height:320px}
    .egrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  }
  .btn:disabled{opacity:.45;cursor:default}
  .rstats{font-size:13px;color:var(--grey);background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:2px;margin-bottom:14px}
  .rstats b{color:var(--navy)}

  /* 气球 */
  .bl{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
  .blslot{height:180px;display:flex;align-items:flex-end;justify-content:center}
  .balloon{width:92px;height:112px;background:linear-gradient(160deg,#24A69E,#4FC3B8);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;transition:transform .18s ease,background .2s;position:relative;transform-origin:bottom center}
  .balloon:after{content:"";position:absolute;left:50%;bottom:-16px;width:1px;height:18px;background:var(--grey);transform:translateX(-50%)}
  .balloon.pop{background:#DCDCDC;transform:scale(.9)!important}
  .pumps{font-size:13px;color:var(--grey);margin-top:26px}
  .blrow{display:flex;gap:10px;margin-top:12px}
  .bstat{display:flex;gap:16px;font-size:13px;color:var(--grey);margin-top:18px}
  .bstat b{color:var(--navy)}

  /* 抛球 */
  .cb{position:relative;height:300px;margin:18px 0 10px}
  .pl{position:absolute;width:88px;text-align:center;transform:translate(-50%,-50%);transition:left .45s ease,top .45s ease}
  .think{font-size:13px;color:var(--teal);height:16px;letter-spacing:.12em}
  .av{width:64px;height:64px;margin:0 auto;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;transition:.15s}
  .pl.me .av{border-color:var(--navy)}
  .pl.has .av{border-color:var(--teal);background:var(--panel);transform:scale(1.06)}
  .nm2{font-size:12px;color:var(--grey);margin-top:7px}
  .ball{font-size:15px;height:18px;margin-top:3px}
  .cbstat{font-size:13px;color:var(--grey);text-align:center;margin-bottom:6px;min-height:22px}
  .cbstat b{color:var(--navy)}
  .hint{font-size:13px;color:var(--navy);text-align:center;margin-top:10px}
  .hint b{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
  .pl.pick{cursor:pointer}
  .pl.pick .av{box-shadow:0 0 0 3px rgba(36,166,158,.9);animation:cbpulse 1.1s ease-in-out infinite}
  .pl.pick:hover .av{transform:scale(1.08)}
  @keyframes cbpulse{0%,100%{box-shadow:0 0 0 3px rgba(36,166,158,.9)}50%{box-shadow:0 0 0 8px rgba(36,166,158,0)}}

  @media print{.tabs{display:none}}
</style>
</head>

    <p data-page-node-id="N5V6XHqAMXInnJfEFIcCTB">A–D 参考《人格营销清单.md》；E 为 BART 气球风险任务、F 为 Cyberball 抛球范式的简化演示。不收集任何数据，全程在浏览器本地完成。</p>

/* ============ 渲染 ============ */
var ST = {};
var stage = document.getElementById('stage');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function refBox(d){
  if(!d.ref) return '';
  return '<div class="refbox">' + d.ref.map(function(r){
    return '<div><b>' + esc(r[0]) + '</b> · ' + esc(r[1]) + '</div>';
  }).join('') + '</div>';
}
function head(d){
  return '<div class="qhead"><div class="badge">' + d.badge + '</div><h2>' + esc(d.name) + '</h2></div>' +
         '<p class="qnote">' + esc(d.note) + '</p>' + refBox(d);
}

/* --- emoji 网格 --- */
function renderGrid(id){
  var d = DATA[id];
  stage.innerHTML = head(d) +
    '<p class="hint">点一个你直觉想选的（没有对错，别想太久）。</p>' +
    '<div class="egrid">' + d.items.map(function(it){
      return '<button class="eitem" data-k="' + it.k + '">' +
             '<span class="em">' + it.em + '</span><span class="nm">' + esc(it.nm) + '</span></button>';
    }).join('') + '</div>';
  [].forEach.call(stage.querySelectorAll('.eitem'), function(b){
    b.onclick = function(){
      b.classList.add('sel');
      var em = b.querySelector('.em').textContent;
      setTimeout(function(){ showResult(id, b.dataset.k, em); }, 200);
    };
  });
}

/* --- 会议室 --- */
function renderChair(id){
  var d = DATA[id];
  var seats = d.seats.map(function(se){
    return '<button class="seat" data-k="' + se.k + '" style="left:' + se.l + ';top:' + se.t + 'px">' + se.id + '</button>';
  }).join('');
  stage.innerHTML = head(d) +
    '<p class="hint">点一把椅子坐下（① 最靠近主持位，⑦ 正对老板，⑧ 靠窗，⑨ 靠门）。</p>' +
    '<div class="room">' +
      '<div class="table">会议桌</div>' +
      '<button class="seat boss" style="left:50%;top:42px">主</button>' +
      seats +
    '</div>';
  [].forEach.call(stage.querySelectorAll('.seat:not(.boss)'), function(b){
    b.onclick = function(){
      b.classList.add('sel');
      setTimeout(function(){ showResult(id, b.dataset.k, ''); }, 220);
    };
  });
}

/* --- 气球风险测验（BART 简化版） --- */
var BL=null;
function roll(){return 4+Math.floor(Math.random()*17);}
function renderBalloon(id){
  var d=DATA[id];
  BL={id:id,i:0,pumps:0,temp:0,total:0,pops:0,sumPumps:0,popAt:roll()};
  stage.innerHTML=head(d)+
    '<div class="bl"><div class="blslot"><div class="balloon" id="bl"></div></div>'+
    '<div class="pumps" id="blp"></div>'+
    '<div class="blrow"><button class="btn ghost" id="bank">收下得分</button></div>'+
    '<div class="hint" id="blhint">按 <b>空格键</b> 给气球打气</div>'+
    '<div class="bstat" id="bls"></div></div>';
  blPaint();
  document.getElementById('bank').onclick=blBank;
}
function blLock(v){document.getElementById('bank').disabled=v;}
function blPaint(){
  var sc=Math.min(1.22, 1+BL.pumps*0.016);
  document.getElementById('bl').style.transform='scale('+sc+')';
  document.getElementById('blp').textContent='本轮已打气 '+BL.pumps+' 次 · 当前可收 '+BL.temp+' 分';
  document.getElementById('bls').innerHTML='第 '+(BL.i+1)+'/'+DATA[BL.id].trials+' 个气球 · 总分 <b>'+BL.total+'</b> · 已爆 <b>'+BL.pops+'</b>';
}
function blPump(){
  BL.pumps++;BL.sumPumps++;BL.temp+=2;
  if(BL.pumps>=BL.popAt){
    BL.pops++;
    document.getElementById('bl').classList.add('pop');
    document.getElementById('blp').textContent='爆了！这轮 '+BL.temp+' 分没了';
    document.getElementById('bls').innerHTML='第 '+(BL.i+1)+'/'+DATA[BL.id].trials+' 个气球 · 总分 <b>'+BL.total+'</b> · 已爆 <b>'+BL.pops+'</b>';
    blLock(true);setTimeout(blNext,1100);return;
  }
  blPaint();
}
function blBank(){
  BL.total+=BL.temp;
  document.getElementById('blp').textContent='收下 '+BL.temp+' 分';
  document.getElementById('bank').blur();
  blLock(true);setTimeout(blNext,700);
}
function blNext(){
  BL.i++;BL.temp=0;BL.pumps=0;BL.popAt=roll();
  if(BL.i>=DATA[BL.id].trials){blFinish();return;}
  document.getElementById('bl').classList.remove('pop');
  blLock(false);blPaint();
}
function blFinish(){
  var d=DATA[BL.id],avg=BL.sumPumps/d.trials;
  var key=avg<=3?'safe':avg<=6?'steady':avg<=10?'balance':avg<=14?'risk':'wild';
  if(BL.pops>=3&&(key==='balance'||key==='risk'))key=(key==='balance')?'risk':'wild';
  var stats='总分 <b>'+BL.total+'</b> 分 · 爆掉 <b>'+BL.pops+'/'+d.trials+'</b> · 平均打气 <b>'+avg.toFixed(1)+'</b> 次';
  showResult(BL.id,key,'',stats);
}

/* --- 抛球游戏（Cyberball 简化版） --- */
var CB=null;
function cbPos(id){
  if(!CB.hasC){
    var a={A:[22,14],B:[78,14],me:[50,80]};   // 倒三角：用户在底部
    return a[id];
  }
  var b={A:[18,16],B:[82,16],C:[18,82],me:[82,82]};  // 四人：正方形四角
  return b[id];
}
function cbPlayers(){
  var p=[{id:'me',em:'🙋',nm:'你'},{id:'A',em:'🐨',nm:'小A'},{id:'B',em:'🐰',nm:'小B'}];
  if(CB.hasC)p.push({id:'C',em:'🐣',nm:'小C'});
  return p;
}
function cbPaint(){
  var ps=cbPlayers();
  document.getElementById('cb').innerHTML=ps.map(function(p){
    var pos=cbPos(p.id);
    var pick=CB.choice&&CB.choice.ids.indexOf(p.id)>=0;
    return '<div class="pl'+(p.id==='me'?' me':'')+(CB.holder===p.id?' has':'')+(pick?' pick':'')+'" '+
      'style="left:'+pos[0]+'%;top:'+pos[1]+'%"'+(pick?' data-pick="'+p.id+'"':'')+'>'+
      '<div class="av">'+p.em+'</div><div class="nm2">'+esc(p.nm)+'</div>'+
      '<div class="ball">'+(CB.holder===p.id?'⚽':'')+'</div>'+
      '<div class="think">'+(CB.think===p.id?'···':'')+'</div></div>';
  }).join('');
  if(CB.choice){
    [].forEach.call(document.querySelectorAll('#cb .pl.pick'),function(el){
      el.onclick=function(){
        var t=el.dataset.pick, f=CB.choice.fn;
        CB.choice=null; cbAct(''); cbPaint();
        f(t);
      };
    });
  }
}
function cbStat(t){document.getElementById('cbstat').innerHTML=t;}
function cbAct(h){document.getElementById('cbact').innerHTML=h;}
function cbAsk(ids,fn){
  CB.choice={ids:ids,fn:fn};
  cbAct('<div class="hint">点击你想传球的头像</div>');
  cbPaint();
}
/* 电脑抛球：先停顿 1 秒（显示「···」），再出手，避免机械感 */
function aiThrow(to,fn){
  CB.think=CB.holder;cbPaint();
  setTimeout(function(){
    CB.think=null;CB.holder=to;cbPaint();
    setTimeout(fn, 300+Math.random()*220);
  }, 500);   // 抛球前电脑停顿 0.5 秒
}
function renderCyber(id){
  var d=DATA[id];
  CB={id:id,phase:1,holder:'A',think:null,p3:{A:0,B:0,C:0},mirror:0,hasC:false};
  stage.innerHTML=head(d)+
    '<div class="cbstat" id="cbstat"></div><div class="cb" id="cb"></div>'+
    '<div class="choices" id="cbact"></div>';
  cbPaint();cbRun();
}
function cbRun(){
  if(CB.phase===1)runP1(0);
  else if(CB.phase===2)runP2(0);
  else runP3(0);
}
var P1=['me','B','me','A','me','B'];
function runP1(i){
  if(i>=P1.length){
    CB.phase=2;
    cbStat('第一轮结束——你拿到球 3 次。第二轮开始。');
    setTimeout(function(){cbRun();},1100);return;
  }
  var to=P1[i];
  cbStat('第一轮 · 热身（第 '+(i+1)+'/'+P1.length+' 次传递）');
  if(to==='me'){
    aiThrow('me',function(){
      cbAsk(['A','B'],function(t){CB.holder=t;cbPaint();setTimeout(function(){runP1(i+1);},380);});
    });
  }else{
    aiThrow(to,function(){runP1(i+1);});
  }
}
function runP2(i){
  var N=4;
  if(i>=N){
    CB.phase=3;CB.hasC=true;cbPaint();
    cbStat('小C 加入了。球回到你手上——接下来 6 次都由你决定传给谁。');
    setTimeout(function(){runP3(0);},1400);return;
  }
  cbStat('第二轮 · 你已经 <b>'+i+'</b> 次没拿到球了');
  aiThrow(Math.random()<0.5?'A':'B',function(){runP2(i+1);});
}
/* 第三轮：轮流由 A / B / C 把球传给你（不是只有小C），
   记录你「是否回传给刚传给你的人」= 对等记账 / 记仇倾向 */
var IN3=['A','B','C','A','B','C'];
function runP3(i){
  if(i>=IN3.length){cbFinishCyber();return;}
  var from=IN3[i];
  CB.holder=from;cbPaint();
  cbStat('第三轮 · 第 '+(i+1)+'/'+IN3.length+' 次 · 把球传给谁？');
  setTimeout(function(){
    aiThrow('me',function(){
      cbAsk(['A','B','C'],function(t){
        CB.p3[t]++;
        if(t===from)CB.mirror++;
        if(t==='C'){
          // 小C 拿到球：随机分流，不固定只传回给你
          cbStat('小C 接到球——它要抛给谁？');
          setTimeout(function(){
            var recips=['A','B','me'];
            var to=recips[Math.floor(Math.random()*recips.length)]; // 分流：给 A / B / 你
            aiThrow(to,function(){ setTimeout(function(){runP3(i+1);},420); });
          },800);
        }else{
          CB.holder=t;cbPaint();
          setTimeout(function(){runP3(i+1);},420);
        }
      });
    });
  },520);
}
function cbFinishCyber(){
  var p=CB.p3;
  var key;
  var spread=Math.max(p.A,p.B,p.C)-Math.min(p.A,p.B,p.C);
  var allThree=p.A>=1&&p.B>=1&&p.C>=1;
  var key;
  if(p.C>=3)key='care';                  // 关注弱小：明显偏向小C
  else if(CB.mirror>=4)key='ledger';     // 记仇：回传给刚传你球的人
  else if((p.A+p.B)>=4)key='forgive';    // 宽容：仍把球给之前冷落你的人
  else if(allThree&&spread<=1)key='turn';// 轮着玩：三人分配均衡
  else key='careless';                   // 无所谓：无明显模式、无波动
  var stats='传给小C <b>'+p.C+'</b> 次 · 传给小A/小B <b>'+(p.A+p.B)+'</b> 次 · '+
            '回传给刚传你球的人 <b>'+CB.mirror+'</b> 次';
  showResult(CB.id,key,'',stats);
}

/* --- 结果 --- */
function showResult(id, key, em, stats){
  var d = DATA[id], r = d.results[key];
  if(!r) return;
  stage.innerHTML =
    '<div class="result">' +
      '<div class="rtype">你的结果 · ' + d.badge + ' ' + esc(d.name) + '</div>' +
      (em ? '<div class="rpick">' + em + '</div>' : '') +
      '<div class="rname">' + esc(r.name) + '</div>' +
      '<div class="rline">「' + esc(r.line) + '」</div>' +
      '<div class="tags">' + r.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('') + '</div>' +
      (stats ? '<div class="rstats">'+stats+'</div>' : '') +
      '<div class="blind">盲区：' + esc(r.blind) + '</div>' +
      '<div class="copy"><b>可晒文案</b>' + esc(r.copy) + '</div>' +
      '<div class="btnrow">' +
        '<button class="btn" id="again">再选一次</button>' +
        '<button class="btn ghost" id="back">换一个测验</button>' +
      '</div>' +
    '</div>';
  document.getElementById('again').onclick = function(){ switchTo(id); };
  document.getElementById('back').onclick = function(){
    var order = ['A','B','C','D','E','F'], i = order.indexOf(id);
    switchTo(order[(i+1) % order.length]);
  };
}

function switchTo(id){
  BL=null; CB=null;
  ST[id] = {};
  [].forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.classList.toggle('on', b.dataset.q === id);
  });
  var k = DATA[id].kind;
  if(k === 'chair') renderChair(id);
  else if(k === 'grid') renderGrid(id);
  else if(k === 'balloon') renderBalloon(id);
  else renderCyber(id);
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(b && b.dataset.q) switchTo(b.dataset.q);
});

switchTo('A');

document.addEventListener('keydown', function(e){
  if(e.code==='Space' || e.key===' ' || e.key==='Spacebar'){
    if(e.repeat) return;
    var bank=document.getElementById('bank');
    if(BL && document.getElementById('bl') && bank && !bank.disabled){
      e.preventDefault();
      blPump();
    }
  }
});
</script>
