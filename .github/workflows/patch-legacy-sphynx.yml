name: Patch legacy Sphynx asset

on:
  push:
    branches: [finalize-modular-product]
    paths:
      - .github/workflows/patch-legacy-sphynx.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch legacy asset reference
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'persona-image.html';
          let s = fs.readFileSync(file, 'utf8');
          const beforeResult = "ENTP:['cat_sphynx','ENTP · 斯芬克斯猫'";
          const afterResult = "ENTP:['cat_sphynx.svg','ENTP · 斯芬克斯猫'";
          const beforeSrc = "var src=(img||(hasImg?'img/'+r[0]+'.jpg':''));";
          const afterSrc = "var src=(img||(hasImg?'img/'+r[0]+(String(r[0]).indexOf('.')>=0?'':'.jpg'):''));";
          if (!s.includes(afterResult)) {
            if (!s.includes(beforeResult)) throw new Error('legacy Sphynx result marker not found');
            s = s.replace(beforeResult, afterResult);
          }
          if (!s.includes(afterSrc)) {
            if (!s.includes(beforeSrc)) throw new Error('legacy result asset resolver marker not found');
            s = s.replace(beforeSrc, afterSrc);
          }
          fs.writeFileSync(file, s, 'utf8');
          NODE
          rm -f img/cat_sphynx.jpg
          node scripts/extract-test-data.mjs
      - name: Commit legacy cleanup
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- persona-image.html img/cat_sphynx.jpg assets/data/test-data.js)" ]; then
            echo "Nothing to change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A persona-image.html img/cat_sphynx.jpg assets/data/test-data.js
          git commit -m "Use distinct Sphynx asset in legacy page [skip ci]"
          git push
