name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node --check scripts/check-static.mjs
          node --check scripts/extract-test-data.mjs
          node --check tests/smoke.mjs
      - name: Check Python syntax
        run: python -m py_compile scripts/optimize-images.py
      - name: Verify generated test data is current
        shell: bash
        run: |
          node scripts/extract-test-data.mjs
          git diff --exit-code -- assets/data/test-data.js
      - name: Validate static project
        run: node scripts/check-static.mjs

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/persona-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/play.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/persona-http.log
          exit 1
      - name: Run browser smoke tests
        run: node tests/smoke.mjs
